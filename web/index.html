<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>LEVELIFE</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/web/css/game.css">
</head>
<body>
  <canvas id="mundo" aria-label="Campus de LEVELIFE"></canvas>

  <header id="hud" hidden>
    <div class="hud-jugador">
      <canvas id="hud-cara" width="40" height="40"></canvas>
      <div class="hud-identidad">
        <strong id="hud-nombre"></strong>
        <span id="hud-ciclo"></span>
      </div>
      <div class="hud-recursos">
        <div class="recurso" title="Valor del juego: baja con las acciones agotadoras">
          <span class="recurso-nombre"><i data-icono="bateria"></i>Energía Ejecutiva</span>
          <span class="recurso-barra"><i id="hud-energia"></i></span>
          <b id="hud-energia-valor"></b>
        </div>
        <div class="recurso" title="Valor del juego: sube con las entregas y la indecisión">
          <span class="recurso-nombre"><i data-icono="cerebro"></i>Carga Mental</span>
          <span class="recurso-barra"><i id="hud-tension"></i></span>
          <b id="hud-tension-valor"></b>
        </div>
      </div>
    </div>
    <nav class="hud-navegacion">
      <button id="hud-misiones" class="btn-hud" type="button"><i data-icono="agenda"></i>Agenda:<span id="hud-cuenta">0 Dilemas</span></button>
      <button id="hud-mapa" class="btn-hud" type="button">Mapa</button>
      <button id="hud-vela" class="btn-hud vela" type="button" aria-label="Hablar con Vela, la agente de IA"><i data-icono="llama"></i>Vela</button>
      <button id="hud-menu" class="btn-hud" type="button">Menú</button>
    </nav>
  </header>
  <div id="objetivo" hidden><span id="hud-objetivo"></span><span id="hud-lugar"><i data-icono="pin"></i><span id="hud-zona"></span></span></div>

  <div id="dialogo" class="marco" hidden>
    <div id="dialogo-retrato"><canvas width="40" height="40"></canvas></div>
    <div id="dialogo-cuerpo">
      <div id="dialogo-nombre"></div>
      <p id="dialogo-texto" aria-live="polite"></p>
      <div id="dialogo-opciones"></div>
      <span id="dialogo-sigue">▼</span>
    </div>
  </div>

  <div id="tactil" hidden>
    <div class="cruz">
      <button data-dir="up" aria-label="Arriba">▲</button>
      <button data-dir="left" aria-label="Izquierda">◀</button>
      <button data-dir="right" aria-label="Derecha">▶</button>
      <button data-dir="down" aria-label="Abajo">▼</button>
    </div>
    <div class="acciones">
      <button data-boton="b" aria-label="Menú">B</button>
      <button data-boton="a" aria-label="Interactuar">A</button>
    </div>
  </div>

  <main id="capa" hidden></main>
  <div id="aviso" role="status" hidden></div>
  <div id="fundido"></div>
  <script type="module" src="/web/js/main.js"></script>
</body>
</html>
